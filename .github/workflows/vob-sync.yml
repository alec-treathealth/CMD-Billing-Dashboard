# LIVE — daily incremental Monday -> vob.indigo_vob sync (enabled 2026-07-24 after 2 green supervised runs).
#
# Provisioned: 0062 + 0065 applied; secrets INDEX_HMAC_KEY + CMD_ROLLUP_WRITER_DATABASE_URL set; the
# Monday token is reused from the existing MONDAY_API_SECRET_KEY secret (board 1606316049 read + files).
# Health/telemetry: each run writes vob.sync_state (upserted/deactivated/reactivated/errors + a note
# splitting errors into no_pdf vs download_fail). Also runnable on demand via workflow_dispatch.
#
# TLS: the writer URL is sslmode=verify-full. In CI (no CA file) the sync script transparently
# downgrades to sslmode=require (encrypted, no cert verify). To keep full verification, commit the
# Supabase CA and set SUPABASE_CA_PATH.
#
# SECURITY: only secrets.* are referenced, and only inside env:. No untrusted github.event.* input
# is used anywhere, so there is no workflow-injection surface.

name: vob-sync

on:
  schedule:
    - cron: '17 9 * * *'         # daily 09:17 UTC
  workflow_dispatch: {}          # also runnable on demand

concurrency:
  group: vob-sync
  cancel-in-progress: false      # never overlap runs

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install "psycopg[binary]" pypdf requests
      - name: Run incremental sync
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_SECRET_KEY }}  # reuse the existing repo secret
          INDEX_HMAC_KEY: ${{ secrets.INDEX_HMAC_KEY }}
          CMD_ROLLUP_WRITER_DATABASE_URL: ${{ secrets.CMD_ROLLUP_WRITER_DATABASE_URL }}
        run: python etl/vob/vob_cron_sync.py
